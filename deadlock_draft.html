<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deadlock Draft Overlay - Vertical</title>
    <style>
        /* --- BASE SETUP --- */
        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: #1a1a1a; /* Can replace with a map background image */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* --- TEAM SECTIONS --- */
        .team-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 25px 0;
        }

        /* --- HEADERS --- */
        .team-header {
            display: flex;
            align-items: center;
            width: 1700px;
            height: 80px;
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 12px;
            padding: 0 30px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
        }

        #blue-section .team-header {
            margin-bottom: 20px;
            border-bottom: 5px solid #569cd6;
        }

        #red-section .team-header {
            flex-direction: row-reverse;
            margin-top: 20px;
            border-top: 5px solid #f44747;
        }

        .team-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .team-name {
            font-size: 42px;
            font-weight: bold;
            margin: 0 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- HORIZONTAL ROSTERS --- */
        .roster {
            display: flex;
            flex-direction: row;
            gap: 25px;
            width: 1700px;
            justify-content: center;
        }

        /* --- VERTICAL PLAYER SLOTS --- */
        .player-slot {
            width: 260px;
            height: 380px; /* Tall vertical portrait size */
            background-color: rgba(40, 40, 40, 0.95);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            border: 3px solid #333;
        }

        #blue-section .player-slot { border-color: #569cd6; }
        #red-section .player-slot { border-color: #f44747; }

        .hero-box {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center top; /* Anchors the image to the top so heads aren't cut off */
            position: absolute;
            top: 0;
            left: 0;
            transition: background-image 0.3s ease;
        }

        /* Text bar at the bottom of the portrait */
        .player-info-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0.7) 70%, transparent);
            padding: 20px 15px 10px 15px;
            box-sizing: border-box;
            text-align: center;
        }

        .hero-name {
            font-size: 18px;
            color: #aaaaaa;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .player-name {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- CENTER MATCH INFO --- */
        .center-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            background: rgba(0,0,0,0.4);
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
        }

        .league-info {
            font-size: 38px;
            font-weight: bold;
            color: #e0e0e0;
            text-transform: uppercase;
            letter-spacing: 6px;
        }
        
        .sponsor-info {
            font-size: 22px;
            color: #888;
            margin-top: 10px;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <!-- BLUE TEAM (TOP) -->
    <div id="blue-section" class="team-section">
        <div class="team-header">
            <img class="team-logo" src="" id="blue-logo" style="display: none;">
            <div class="team-name" id="blue-name">PFW</div>
        </div>
        
        <div class="roster" id="blue-roster">
            <!-- JS Generated -->
        </div>
    </div>

    <!-- CENTER INFO -->
    <div class="center-section">
        <div class="league-info" id="league-text">NACE Week 1</div>
        <div class="sponsor-info" id="sponsor-text">PURDUE FORT WAYNE ESPORTS</div>
    </div>

    <!-- RED TEAM (BOTTOM) -->
    <div id="red-section" class="team-section">
        <div class="roster" id="red-roster">
            <!-- JS Generated -->
        </div>

        <div class="team-header">
            <img class="team-logo" src="" id="red-logo" style="display: none;">
            <div class="team-name" id="red-name">OPP</div>
        </div>
    </div>

    <script>
        // --- GENERATE THE 6 ROSTER SLOTS ---
        function createSlots(side) {
            const rosterDiv = document.getElementById(`${side}-roster`);
            for (let i = 0; i < 6; i++) {
                rosterDiv.innerHTML += `
                    <div class="player-slot">
                        <div class="hero-box" id="${side}-hero-${i}"></div>
                        <div class="player-info-bar">
                            <div class="hero-name" id="${side}-heroname-${i}"></div>
                            <div class="player-name" id="${side}-player-${i}">Player ${i+1}</div>
                        </div>
                    </div>
                `;
            }
        }
        createSlots('blue');
        createSlots('red');

        // --- WEBSOCKET CONNECTION ---
        const ws = new WebSocket('ws://localhost:8765');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const timeCache = new Date().getTime();

            // Meta Info
            document.getElementById('league-text').textContent = data.patch;
            document.getElementById('sponsor-text').textContent = data.sponsor;

            ['blue', 'red'].forEach(side => {
                const teamData = data[side];
                
                // Header Updates
                document.getElementById(`${side}-name`).textContent = teamData.name;
                const logoEl = document.getElementById(`${side}-logo`);
                if (teamData.logo) {
                    logoEl.src = teamData.logo + "?t=" + timeCache;
                    logoEl.style.display = 'block';
                } else {
                    logoEl.style.display = 'none';
                }

                // Roster Updates
                for(let i = 0; i < 6; i++) {
                    const playerEl = document.getElementById(`${side}-player-${i}`);
                    if(playerEl && teamData.players && teamData.players[i]) {
                        playerEl.textContent = teamData.players[i];
                    }

                    const heroNameEl = document.getElementById(`${side}-heroname-${i}`);
                    const heroBoxEl = document.getElementById(`${side}-hero-${i}`);
                    
                    if(teamData.picks && teamData.picks[i] && teamData.picks[i] !== "None") {
                        const hero = teamData.picks[i];
                        heroNameEl.textContent = hero;
                        
                        // Converts string exact to your folder layout (e.g., "Lady Geist" -> "ladygeist")
                        const fileName = hero.toLowerCase().replace(/[^a-z]/g, '');
                        
                        // Loads from your images folder
                        heroBoxEl.style.backgroundImage = `url('images/${fileName}.png')`; 
                    } else {
                        heroNameEl.textContent = "";
                        heroBoxEl.style.backgroundImage = "none";
                    }
                }
            });
        };
    </script>
</body>
</html>
